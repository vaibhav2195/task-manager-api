version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - REPOSITORY_TYPE=sqlite
      - SQLITE_DB_PATH=/app/data/tasks.db
    volumes:
      - task_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  task_data:
